name: CD

# Se ejecuta solo cuando el CI termina en verde sobre main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  publicar-imagen:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGEN: ghcr.io/danielandresp1-blip/proyecto_final-api
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Descargar el commit que paso el CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen (tag = hash del commit)
        run: |
          docker build -t $IMAGEN:$SHA -t $IMAGEN:latest ./api
          docker push $IMAGEN:$SHA
          docker push $IMAGEN:latest